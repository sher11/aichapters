<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} - {{ site.title }}</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
      color: #333;
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 280px;
      background: #2c3e50;
      color: #ecf0f1;
      padding: 20px;
      position: fixed;
      height: 100vh;
      overflow-y: auto;
    }

    .sidebar-header h2 {
      margin-bottom: 10px;
    }

    .sidebar-header h2 a {
      color: #ecf0f1;
      text-decoration: none;
    }

    .sidebar-header p {
      font-size: 0.9em;
      color: #bdc3c7;
      margin-bottom: 20px;
    }

    .sidebar-content h3 {
      color: #3498db;
      margin: 20px 0 10px 0;
      font-size: 1.2em;
    }

    .course-section {
      margin-bottom: 20px;
    }

    .course-section h4 {
      margin-bottom: 8px;
    }

    .course-section h4 a {
      color: #ecf0f1;
      text-decoration: none;
      font-size: 1em;
    }

    .course-section h4 a:hover {
      color: #3498db;
    }

    .chapter-list {
      list-style: none;
      margin-left: 10px;
    }

    .chapter-list li {
      margin: 5px 0;
    }

    .chapter-list a {
      color: #bdc3c7;
      text-decoration: none;
      font-size: 0.9em;
      display: block;
      padding: 4px 8px;
      border-radius: 4px;
    }

    .chapter-list a:hover {
      background: #34495e;
      color: #ecf0f1;
    }

    .chapter-list a.active {
      background: #3498db;
      color: #fff;
    }

    .main-content {
      margin-left: 280px;
      padding: 40px;
      flex: 1;
      max-width: 900px;
    }

    .main-content h1 {
      color: #2c3e50;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid #3498db;
    }

    .main-content h2 {
      color: #34495e;
      margin-top: 30px;
      margin-bottom: 15px;
    }

    .main-content h3 {
      color: #34495e;
      margin-top: 20px;
      margin-bottom: 10px;
    }

    .main-content p {
      margin-bottom: 15px;
    }

    .main-content ul, .main-content ol {
      margin-left: 20px;
      margin-bottom: 15px;
    }

    .main-content li {
      margin-bottom: 8px;
    }

    .main-content code {
      background: #f4f4f4;
      padding: 2px 6px;
      border-radius: 3px;
      font-family: "Courier New", monospace;
    }

    .main-content pre {
      background: #f4f4f4;
      padding: 15px;
      border-radius: 5px;
      overflow-x: auto;
      margin-bottom: 15px;
    }

    .course-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .course-card {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 20px;
      background: #fff;
      transition: box-shadow 0.3s;
    }

    .course-card:hover {
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .course-card h3 {
      margin-top: 0;
      color: #2c3e50;
    }

    .course-card a {
      color: #3498db;
      text-decoration: none;
      font-weight: bold;
    }

    .course-card a:hover {
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      .sidebar {
        width: 100%;
        position: relative;
        height: auto;
      }

      .main-content {
        margin-left: 0;
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  {% include sidebar.html %}

  <main class="main-content">
    {{ content }}
  </main>
</body>
</html>
